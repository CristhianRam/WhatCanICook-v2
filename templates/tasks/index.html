<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WHAT CAN I COOK?</title>
    <style>
      :root{
        --bg:#0f172a;
        --card:#0b1220;
        --accent:#ff7a59;
        --muted:#94a3b8;
        --glass: rgba(255,255,255,0.04);
      }
      html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
      body{background: radial-gradient(1000px 500px at 10% 10%, rgba(255,122,89,0.08), transparent), radial-gradient(800px 400px at 90% 90%, rgba(79,70,229,0.06), transparent), var(--bg); color:#e6eef8; display:flex; align-items:center; justify-content:center}
      .container{width:100%;max-width:900px;padding:28px}
      .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:16px; padding:36px; box-shadow:0 6px 30px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.03)}
      h1{margin:0 0 12px 0;font-size:36px;letter-spacing:1px}
      p.lead{margin:0 0 20px 0;color:var(--muted)}
      form{display:flex; gap:12px; align-items:center}
      .input{flex:1; background:var(--glass); border:1px solid rgba(255,255,255,0.04); padding:14px 16px; border-radius:12px; color:inherit; font-size:16px}
      .btn{background:linear-gradient(90deg,var(--accent),#4f46e5); padding:12px 18px; border-radius:12px; color:#071123; font-weight:700; border:none; cursor:pointer; box-shadow:0 6px 18px rgba(79,70,229,0.12)}
      .footer{margin-top:18px;color:var(--muted);font-size:13px}
      .examples{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
      .chip{background:rgba(255,255,255,0.03);padding:8px 12px;border-radius:999px;color:var(--muted);font-size:13px;border:1px solid rgba(255,255,255,0.02)}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>WHAT CAN I COOK?</h1>
        <p class="lead">Describe a dish, list ingredients, or mention a cuisine and I'll suggest recipes.</p>

        <form action="/search" method="post">
          <input name="query" autocomplete="off" placeholder="e.g. chicken, rice, and bell peppers" class="input" />
          <button class="btn" type="submit">Search</button>
        </form>

        <div class="footer">
          <div class="examples">
            <span class="chip">chicken with rice</span>
            <span class="chip">pasta with tomato</span>
            <span class="chip">chocolate dessert</span>
            <span class="chip">quick 30 minutes</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
